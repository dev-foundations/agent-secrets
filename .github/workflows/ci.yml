name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test AgentSecrets.slnx --configuration Release

      - name: Package (win-x64)
        shell: pwsh
        run: ./scripts/package.ps1 -Runtime win-x64

      - name: Install from the package, smoke test, uninstall
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'agentsecrets-install'
          ./scripts/install.ps1 -PackagePath artifacts/dist/agent-secrets-win-x64.zip -InstallDir $dir -NoPath -NoSkills -Yes
          $exe = Join-Path $dir 'bin/agent-secrets.exe'
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "agent-secrets --version failed" }
          & $exe get anything 2>$null
          if ($LASTEXITCODE -ne 2) { throw "expected 'get' to be refused" }
          $global:LASTEXITCODE = 0   # the runner ends the step with 'exit $LASTEXITCODE'
          & (Join-Path $dir 'uninstall.ps1') -InstallDir $dir -KeepSkills -Yes
          if (Test-Path $dir) { throw "uninstall left $dir behind" }

  build-test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Use a temporary keychain
        # The integration tests store fake values in the default keychain. A fresh, unlocked keychain
        # without auto-lock keeps them out of the runner's login keychain and away from any prompt.
        run: |
          keychain="$RUNNER_TEMP/agentsecrets-ci.keychain-db"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p ci "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$keychain"

      - name: Test
        run: dotnet test AgentSecrets.slnx --configuration Release

      - name: Package (osx-arm64)
        run: ./scripts/package.sh --runtime osx-arm64

      - name: Install from the package, smoke test, uninstall
        run: |
          prefix="$RUNNER_TEMP/agentsecrets-install"
          ./scripts/install.sh --package artifacts/dist/agent-secrets-osx-arm64.tar.gz --prefix "$prefix" --no-path --no-skills --yes
          "$prefix/bin/agent-secrets" --version
          status=0
          "$prefix/bin/agent-secrets" get anything 2>/dev/null || status=$?
          if [ "$status" -ne 2 ]; then echo "expected 'get' to be refused (exit 2), got $status"; exit 1; fi
          "$prefix/share/agent-secrets/uninstall.sh" --prefix "$prefix" --keep-skills --yes
          if [ -e "$prefix/bin/agent-secrets" ] || [ -e "$prefix/share/agent-secrets" ]; then echo "uninstall left files behind"; exit 1; fi
