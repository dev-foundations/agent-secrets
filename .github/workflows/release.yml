name: Release

# Push a tag like v0.2.0 to build, test and publish a GitHub release.
# The installer downloads from releases/latest, so the newest release is what users get.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test AgentSecrets.slnx --configuration Release

      - name: Package
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          foreach ($rid in 'win-x64', 'win-arm64') {
            ./scripts/package.ps1 -Runtime $rid -Version $version
          }

      - name: Checksums and scripts
        shell: pwsh
        run: |
          $dist = 'artifacts/dist'
          Copy-Item scripts/install.ps1, scripts/uninstall.ps1 $dist
          Get-ChildItem $dist -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content "$dist/SHA256SUMS.txt" -Encoding ascii
          Get-Content "$dist/SHA256SUMS.txt"

      - name: Verify the x64 package installs
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'agentsecrets-install'
          ./scripts/install.ps1 -PackagePath artifacts/dist/agent-secrets-win-x64.zip -InstallDir $dir -NoPath -NoSkills -Yes
          $installed = & (Join-Path $dir 'bin/agent-secrets.exe') --version
          if ($installed -ne "agent-secrets $('${{ github.ref_name }}'.TrimStart('v'))") { throw "unexpected version: $installed" }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' (Get-ChildItem artifacts/dist -File).FullName `
            --title 'AgentSecrets ${{ github.ref_name }}' --generate-notes --verify-tag
