name: Release

# Push a tag like v0.2.0 to build, test and publish a GitHub release.
# The installers download from releases/latest, so the newest release is what users get.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test AgentSecrets.slnx --configuration Release

      - name: Package
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          foreach ($rid in 'win-x64', 'win-arm64') {
            ./scripts/package.ps1 -Runtime $rid -Version $version
          }

      - name: Verify the x64 package installs
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'agentsecrets-install'
          ./scripts/install.ps1 -PackagePath artifacts/dist/agent-secrets-win-x64.zip -InstallDir $dir -NoPath -NoSkills -Yes
          $installed = & (Join-Path $dir 'bin/agent-secrets.exe') --version
          if ($installed -ne "agent-secrets $('${{ github.ref_name }}'.TrimStart('v'))") { throw "unexpected version: $installed" }

      - uses: actions/upload-artifact@v7
        with:
          name: packages-windows
          path: artifacts/dist/*.zip
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Use a temporary keychain
        # The integration tests store fake values in the default keychain (see ci.yml).
        run: |
          keychain="$RUNNER_TEMP/agentsecrets-ci.keychain-db"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p ci "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$keychain"

      - name: Test
        run: dotnet test AgentSecrets.slnx --configuration Release

      # The .NET SDK signs the binaries ad hoc. Developer ID signing and notarization would go here.
      - name: Package
        run: |
          for rid in osx-arm64 osx-x64; do
            ./scripts/package.sh --runtime "$rid" --version "$GITHUB_REF_NAME"
          done

      - name: Verify the arm64 package installs
        run: |
          prefix="$RUNNER_TEMP/agentsecrets-install"
          ./scripts/install.sh --package artifacts/dist/agent-secrets-osx-arm64.tar.gz --prefix "$prefix" --no-path --no-skills --yes
          installed=$("$prefix/bin/agent-secrets" --version)
          if [ "$installed" != "agent-secrets ${GITHUB_REF_NAME#v}" ]; then echo "unexpected version: $installed"; exit 1; fi

      - uses: actions/upload-artifact@v7
        with:
          name: packages-macos
          path: artifacts/dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts/dist
          pattern: packages-*
          merge-multiple: true

      - name: Checksums and scripts
        run: |
          cp scripts/install.ps1 scripts/uninstall.ps1 scripts/install.sh scripts/uninstall.sh artifacts/dist/
          cd artifacts/dist
          sha256sum $(ls | grep -v '^SHA256SUMS.txt$' | sort) > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a hyphen (v0.2.0-rc.1) is a prerelease: it never becomes releases/latest,
          # which is what the installers download. Notes always start at the last real release,
          # so prereleases in between do not cut them short.
          options=(--title "AgentSecrets $GITHUB_REF_NAME" --generate-notes --verify-tag)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then options+=(--prerelease); fi
          previous=$(gh release list --exclude-pre-releases --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -n "$previous" ]; then options+=(--notes-start-tag "$previous"); fi
          gh release create "$GITHUB_REF_NAME" artifacts/dist/* "${options[@]}"
